# Slack → api.slack.com/apps → Create New App → From an app manifest → pick your workspace →
# paste this (YAML), replacing YOUR-DOMAIN with your app's address.
display_information:
  name: Fireflies Commitments
  description: Confirm, finish, hand over or drop the commitments you made in meetings.
  background_color: "#1c1c20"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Fireflies Commitments
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-DOMAIN/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
